server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Proxy /api/ → NestJS backend ────────────────────────────────────────
  # Never hard-code localhost — use the Docker service name.
  location /api/ {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Return clean JSON errors for backend unavailability
    error_page 502 503 504 /50x.json;
  }

  # ── Proxy /ai/ → FastAPI AI service ─────────────────────────────────────
  # Strips the /ai prefix before forwarding so FastAPI sees /health, /ask, etc.
  location /ai/ {
    proxy_pass         http://ai-service:8000/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Long timeout for PDF processing and LLM calls
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    error_page 502 503 504 /50x.json;
  }

  # ── Static JSON error page for 502/503/504 ──────────────────────────────
  location = /50x.json {
    internal;
    default_type application/json;
    return 503 '{"statusCode":503,"message":"Service temporarily unavailable. Please try again."}';
  }

  # ── SPA fallback (React Router) ─────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Static assets — aggressive caching ──────────────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
