server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow large file uploads (PDFs)
  client_max_body_size 100M;

  # ── Proxy /api/ → NestJS backend ────────────────────────────────────────
  # Never hard-code localhost — use the Docker service name.
  location /api/ {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # LLM synthesis (reviews, gap analysis) can take minutes
    proxy_read_timeout 300s;

    # Return clean JSON errors for backend unavailability
    error_page 502 503 504 /50x.json;
  }

  # Server-Sent Events for research chat: no buffering, or progress events
  # would arrive all at once at the end.
  location = /api/v1/query/ask/stream {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 300s;
  }

  # Socket.IO (live document status). Without this the SPA fallback answered
  # /socket.io/ with index.html and real-time updates never connected.
  location /socket.io/ {
    proxy_pass         http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # The AI service is internal: only the backend calls it (with a shared
  # secret). It is deliberately not proxied to browsers.

  location = /50x.json {
    internal;
    default_type application/json;
    return 503 '{"statusCode":503,"message":"Service temporarily unavailable. Please try again."}';
  }

  # ── SPA fallback (React Router) ─────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Static assets — aggressive caching ──────────────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
