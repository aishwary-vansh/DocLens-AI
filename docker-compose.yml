services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10



  backend-migrate:
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-this-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@doclens.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
      NESTJS_CALLBACK_URL: http://backend:3001/api/v1/internal/ai-callback
    ports:
      - "3001:3001"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
  backend-uploads:
