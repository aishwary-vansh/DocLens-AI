services:
  # ── PostgreSQL + pgvector (self-contained development deployment) ─────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doclens}
      POSTGRES_USER: ${POSTGRES_USER:-doclens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doclens-dev-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doclens} -d ${POSTGRES_DB:-doclens}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Database migration (runs prisma migrate deploy, exits on success) ──────
  backend-migrate:
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://doclens:doclens-dev-password@postgres:5432/doclens}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ── NestJS backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://doclens:doclens-dev-password@postgres:5432/doclens}
      REDIS_URL: redis://redis:6379
      # Inter-container URL for AI service — never use localhost here
      AI_SERVICE_URL: http://ai-service:8000
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-180000}
      AI_SYNTHESIS_TIMEOUT_MS: ${AI_SYNTHESIS_TIMEOUT_MS:-280000}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # CORS: allow any origin (nginx fronts the app; set a specific list for production)
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@doclens.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
      NESTJS_CALLBACK_URL: http://backend:3001/api/v1/internal/ai-callback
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 20

  # ── FastAPI AI service ────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
    # Come back after a crash (e.g. an out-of-memory kill) instead of leaving
    # every later upload and question failing with "AI Service Unavailable".
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://doclens:doclens-dev-password@postgres:5432/doclens}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      PAPER_PROFILE_ENABLED: ${PAPER_PROFILE_ENABLED:-true}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-2000}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-300}
      # Latency knobs (docs/RAG_PIPELINE.md §5, §11)
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      ROUTER_SECTION_BOOST: ${ROUTER_SECTION_BOOST:-0}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.48}
      RETRIEVAL_MIN_RERANK: ${RETRIEVAL_MIN_RERANK:-0}
      MODEL_WARMUP: ${MODEL_WARMUP:-true}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      SYNTHESIS_LLM_TIMEOUT_S: ${SYNTHESIS_LLM_TIMEOUT_S:-100}
      SYNTHESIS_RERANK_BUDGET: ${SYNTHESIS_RERANK_BUDGET:-60}
      VISION_ENABLED: ${VISION_ENABLED:-true}
      VISION_MAX_PAGES: ${VISION_MAX_PAGES:-12}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      # /ingest only reads PDFs from the shared upload volume
      INGEST_ALLOWED_DIR: /app/uploads
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persist downloaded HuggingFace models across container restarts.
      # Without this volume, BAAI/bge-m3 and BAAI/bge-reranker-v2-m3
      # (~3-4 GB each) would be re-downloaded on every docker compose up.
      - huggingface-cache:/root/.cache/huggingface
      - backend-uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      # Long start period: first startup downloads large models
      start_period: 180s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  # ── Nginx / React frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  huggingface-cache:
